# 承認: check_images（レビュー待ち）の画像を public/images へ反映し push する。
# push されると Vercel が本番デプロイする。
# 通常は Claude に「承認」と伝えると Claude がこのワークフローを起動する。
# 手動で承認したい場合は GitHub の Actions から実行してもよい。
name: Approve & deploy images

on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: images-approve
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Approve & deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npx tsx scripts/approve-and-deploy.ts

      - name: Close review issues
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'image-review',
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ 承認され、public/images へ反映・デプロイしました。',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }
